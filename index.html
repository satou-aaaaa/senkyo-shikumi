<style>
/* 投票所の記載台：白い紙に藍の字、朱の「投票」の判。 */
:root{
  --bg:#eceff3; --paper:#ffffff; --ink:#1b2433; --ink2:#4a5566; --line:#1b243326;
  --mo:#1f4a7a; --mo2:#12304f; --shu:#b23a24; --shu2:#7f2414; --ok:#1f6b45; --ok2:#134a2f; --gold:#8f6510; --sky:#e6edf6;
  --f-body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
  color-scheme:light;
}
html{height:100%;font-size:18px}body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-weight:500;-webkit-tap-highlight-color:transparent;line-height:1.6;
  background-image:radial-gradient(#1d2b2610 1px,transparent 1.5px);background-size:18px 18px}
.wrap{max-width:540px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 88px;display:flex;flex-direction:column;gap:14px;min-height:100vh;box-sizing:border-box}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:52px}
h1{font-weight:900;font-size:1.1rem;margin:0;letter-spacing:.04em;flex:1;min-width:0}
h1 small{display:block;font-size:.75rem;letter-spacing:0;color:var(--ink2);font-weight:500;line-height:1.3}
.icon{all:unset;cursor:pointer;font-size:1.2rem;min-width:52px;height:52px;display:grid;place-items:center;border-radius:12px;border:2px solid var(--line);box-sizing:border-box;padding:0 10px;background:var(--paper);font-weight:700}
button.main{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;min-height:60px;border-radius:16px;background:var(--shu);color:#fff;font-weight:900;font-size:1.05rem;padding:8px 18px;text-align:center;box-shadow:0 5px 0 var(--shu2);line-height:1.35;flex-wrap:wrap}
button.main:active{transform:translateY(3px);box-shadow:0 2px 0 var(--shu2)}
button.main.alt{background:var(--mo);box-shadow:0 5px 0 var(--mo2)}
button.main.ok{background:var(--ok);box-shadow:0 5px 0 var(--ok2)}
button.main small{font-weight:500;font-size:.8rem}
button.sub{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;min-height:52px;border-radius:14px;border:2px solid var(--line);background:var(--paper);color:var(--ink);font-weight:700;font-size:.92rem;padding:4px 12px;text-align:center;line-height:1.3}
button.sub:disabled,button.main:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px}.row>.sub,.row>.main{flex:1 1 0}
.note{color:var(--ink2);font-size:.85rem;line-height:1.7;margin:0;text-align:center}
.note a,.about a,.tecard a{color:var(--shu2);display:inline-flex;align-items:center;min-height:44px}
.big{font-weight:900;font-size:1.45rem;text-align:center;margin:0;line-height:1.35}
.title{font-weight:900;font-size:2rem;letter-spacing:.1em;text-align:center;margin:6px 0 0;color:var(--mo2);line-height:1.25}
.title span{color:var(--shu)}
.title small{display:block;font-size:.8rem;letter-spacing:.3em;color:var(--ink2);font-weight:700}
.lead{text-align:center;color:var(--ink2);margin:0;font-size:.92rem;line-height:1.7}
.tip{background:var(--paper);border:2px dashed var(--gold);border-radius:14px;padding:.6rem .9rem;font-size:.88rem;line-height:1.7;text-align:left}
.tip b{color:var(--shu2)}
/* 問いの札 */
.card{position:relative;background:var(--paper);border:2px solid var(--line);border-radius:6px 6px 16px 16px;padding:.9rem .9rem 1rem;box-shadow:0 6px 16px #1d2b261c}
.card::before{content:"せんきょ";position:absolute;top:-11px;left:14px;background:var(--mo);color:#fff;font-size:.72rem;font-weight:900;letter-spacing:.2em;padding:1px 10px;border-radius:6px}
.who{display:flex;gap:.7rem;align-items:flex-start}
.ava{flex:none;width:3.2rem;height:3.2rem;border-radius:50%;display:grid;place-items:center;font-size:1.9rem;background:var(--sky);border:2px solid var(--mo)}
.bubble{position:relative;flex:1;min-width:0;background:#fff;border:2px solid var(--ink);border-radius:14px;padding:.55rem .75rem;font-size:1rem;line-height:1.75;text-align:left}
.bubble::before{content:"";position:absolute;left:-9px;top:14px;border:8px solid transparent;border-right-color:var(--ink);border-left:0}
.bubble .nm{display:block;font-size:.75rem;color:var(--ink2);font-weight:700}
.q{margin:.8rem 0 0;font-weight:900;font-size:1.02rem;text-align:center;color:var(--mo2)}
/* 日付の問題のカレンダー */
/* 選び肢 */
.choices{display:flex;flex-direction:column;gap:10px}
.choices.two{display:grid;grid-template-columns:1fr 1fr}
.choices.four{display:grid;grid-template-columns:1fr 1fr}
.ch{all:unset;box-sizing:border-box;cursor:pointer;position:relative;min-height:3.6rem;display:flex;align-items:center;gap:.6rem;border-radius:14px;background:var(--paper);border:3px solid var(--mo);box-shadow:0 4px 0 #1f5c4a55;font-weight:700;font-size:.98rem;color:var(--ink);padding:.55rem .8rem .55rem .7rem;line-height:1.5;text-align:left}
.choices.two .ch,.choices.four .ch{justify-content:center;text-align:center;font-size:1.05rem;font-weight:900;min-height:4rem}
.ch .no{flex:none;width:1.7rem;height:1.7rem;border-radius:50%;display:grid;place-items:center;background:var(--mo);color:#fff;font-size:.8rem;font-weight:900}
.choices.two .ch .no,.choices.four .ch .no{display:none}
.ch:active{transform:translateY(3px);box-shadow:0 1px 0 #1f5c4a55}
.ch.ng{opacity:.55;border-color:var(--shu);border-style:dashed;cursor:default;box-shadow:none;animation:shake .4s;padding-right:4.6rem}
.ch.ng::after{content:"✕ ちがう";position:absolute;top:50%;transform:translateY(-50%);right:8px;font-size:.78rem;font-weight:900;color:var(--shu2)}
.ch.ok{border-color:var(--ok);background:#ecf6ef;box-shadow:0 4px 0 #1f6b4566;padding-right:4.6rem}
.ch.ok::after{content:"✓ 正解";position:absolute;top:50%;transform:translateY(-50%);right:8px;font-size:.78rem;font-weight:900;color:var(--ok2)}
.choices.two .ch.ok,.choices.two .ch.ng,.choices.four .ch.ok,.choices.four .ch.ng{padding-right:.6rem;padding-top:1.3rem}
.choices.two .ch.ok::after,.choices.two .ch.ng::after,.choices.four .ch.ok::after,.choices.four .ch.ng::after{top:4px;transform:none}
.ch:disabled{cursor:default}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes up{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
@keyframes stamp{0%{transform:scale(2.2) rotate(-18deg);opacity:0}60%{transform:scale(.92) rotate(-12deg);opacity:1}100%{transform:scale(1) rotate(-12deg)}}
.msg:empty{min-height:0;margin-top:-14px}
#hintbox:empty{display:none}
.score{text-align:center;margin:0;font-weight:700;color:var(--ink2)}
.score b{font-size:1.25rem;color:var(--ink)}
.agrp .cnt{font-weight:700;color:var(--ink2);margin-left:.4rem;font-size:.85em}
.msg{min-height:1.6rem;text-align:center;font-weight:700;font-size:.95rem;margin:0}
.msg.bad{color:var(--shu2)}
.verdict{position:relative;overflow:hidden;background:var(--paper);border:2px solid var(--ok);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 6px 0 #1d2b2620;animation:up .35s ease-out}
.verdict .hd{display:flex;align-items:center;gap:10px;font-size:1.25rem;font-weight:900;flex-wrap:wrap;padding-right:4.4rem}
.verdict .why{font-size:.95rem;line-height:1.75;margin:0;text-align:left}
.verdict .why b{color:var(--ok2)}
.verdict .te{font-size:.85rem;line-height:1.6;margin:0;padding:.45rem .6rem;border-radius:10px;background:var(--sky);text-align:left}
.verdict .te b{color:var(--mo2)}
.seal{position:absolute;right:12px;top:10px;width:3.6rem;height:3.6rem;border-radius:50%;border:3px solid var(--shu);color:var(--shu);display:grid;place-items:center;font-weight:900;font-size:.72rem;line-height:1.1;text-align:center;transform:rotate(-12deg);animation:stamp .45s ease-out;background:#fff8}
.hint{background:var(--paper);border:2px solid var(--gold);border-radius:14px;padding:.6rem .9rem;font-size:.92rem;line-height:1.7}
.stars{color:var(--gold);letter-spacing:.08em;font-size:1.15rem}
.stars .off{color:#1d2b2633}
.dots{display:flex;gap:6px;flex:1;max-width:200px}
.dots i{flex:1;height:8px;border-radius:4px;background:var(--line)}
.dots i.on{background:var(--shu);height:12px}.dots i.done{background:var(--mo)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center}
.stats b{display:block;font-size:1.25rem}
.stats small{color:var(--ink2);font-size:.75rem}
.share{background:var(--paper);border-radius:12px;padding:12px;white-space:pre-line;font-size:1rem;line-height:1.6;text-align:center;border:2px solid var(--line)}
.shares{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.shares a,.shares button{display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:12px;border:2px solid var(--line);background:var(--paper);color:var(--ink);font-size:.9rem;font-weight:700;text-decoration:none;padding:0 6px;box-sizing:border-box;font-family:inherit;cursor:pointer}
.rlist{display:flex;flex-direction:column;gap:8px}
.rlist div{display:flex;align-items:center;gap:10px;background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:8px 12px;font-size:.88rem;line-height:1.5}
.rlist .w{flex:1;min-width:0}
.rlist .w b{display:block;font-size:.92rem}
.achnext{text-align:center;font-size:.9rem;color:var(--ink2);margin:0}
.achnew{text-align:center;font-size:.95rem;font-weight:700;color:var(--shu2);margin:0;animation:up .35s ease-out}
.badge{background:var(--shu);color:#fff;border-radius:9px;padding:1px 7px;font-size:.75rem}
.lv{display:flex;flex-direction:column;gap:10px}
.votes{width:100%;border-collapse:collapse;margin:.7rem 0 .2rem;font-size:1rem}
.votes caption{text-align:left;font-size:.8rem;font-weight:700;color:var(--ink2);padding-bottom:.2rem}
.votes th,.votes td{border:1.5px solid var(--line);padding:.35rem .6rem;text-align:left}
.votes td{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.votes thead th{background:var(--sky);font-size:.8rem}
/* しくみ帳 */
.book{display:flex;flex-direction:column;gap:8px}
.book button,.book .none{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:2.2rem 1fr auto;align-items:center;gap:10px;min-height:56px;border-radius:12px;padding:6px 12px;background:var(--paper);border:2px solid var(--line);font-size:.95rem}
.book .none{cursor:default;color:var(--ink2);border-style:dashed}
.book .mk{font-size:1.3rem;text-align:center}
.book .ct{font-size:.8rem;color:var(--ink2);white-space:nowrap}
.tecard{background:var(--paper);border:2px solid var(--mo);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.tecard h2{margin:0;font-size:1.2rem;color:var(--mo2)}
.tecard p{margin:0;font-size:.95rem;line-height:1.75;text-align:left}
.tecard .lab{font-size:.78rem;font-weight:900;color:var(--ink2);letter-spacing:.1em}
.agrp{font-size:.85rem;color:var(--ink2);margin:4px 0 -6px;font-weight:700;letter-spacing:.1em}
.alist{display:flex;flex-direction:column;gap:8px}
.ach{display:grid;grid-template-columns:1.8rem 1fr auto;grid-template-areas:"ic nm pg" "ic cd cd" "ic br br";align-items:center;gap:3px 10px;background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:8px 12px}
.ach .ic{grid-area:ic;font-size:1.2rem;text-align:center}
.ach b{grid-area:nm;font-size:.95rem}.ach small{grid-area:cd;color:var(--ink2);font-size:.8rem;line-height:1.4}
.ach .pg{grid-area:pg;font-size:.8rem;color:var(--ink2);white-space:nowrap}
.ach .bar{grid-area:br;height:6px;border-radius:3px;background:var(--line);overflow:hidden}.ach .bar i{display:block;height:100%;background:var(--mo)}
.ach.got{background:#ebf4ef;border-color:var(--mo)}
.ach:not(.got) .ic{filter:grayscale(1);opacity:.5}
.calnav{display:flex;align-items:center;gap:8px}.calnav b{flex:1;text-align:center;font-size:1.05rem}.calnav .sub{flex:0 0 72px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{font-size:.7rem;color:var(--ink2);text-align:center}
.cal .c{all:unset;box-sizing:border-box;min-height:48px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.9rem;background:var(--paper);border:1px solid var(--line);position:relative;line-height:1.1}
.cal .c i{font-style:normal;font-size:.55rem;letter-spacing:-.05em;color:var(--gold)}
.cal .c.p1{background:#ebf4ef}.cal .c.p2{background:#cfe5d8}.cal .c.p3{background:var(--mo);color:#fff;border-color:var(--mo2)}.cal .c.p3 i{color:#ffe9a8}
.cal .c.late{background:transparent;border:1.5px dashed var(--mo);color:var(--mo2)}
.cal .c.miss{cursor:pointer;border:2px dotted var(--shu);color:var(--shu2);background:#fff}
.cal .c.miss i{color:var(--shu2)}
.cal .c.today{border:2px solid var(--ink)}
.cal .c .hd{position:absolute;right:2px;top:1px;font-size:.55rem;color:var(--shu2);font-weight:900}
.cal .c.p3 .hd{color:#ffe9a8}
.cal .c.off{visibility:hidden}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:center;font-size:.75rem;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:4px}.legend em{display:inline-block;width:14px;height:14px;border-radius:4px;font-style:normal}
.about h3{font-size:1rem;margin:.6rem 0 .2rem;color:var(--mo2)}
.about p,.about li{font-size:.92rem;line-height:1.8;text-align:left}
.about ul{padding-left:1.2em;margin:0}
dialog#howto{border:none;border-radius:16px;background:var(--paper);color:var(--ink);max-width:440px;width:calc(100% - 32px);padding:20px;box-sizing:border-box;font-size:1rem}
dialog#howto::backdrop{background:#000000aa}
dialog#howto h2{margin:0 0 10px;letter-spacing:.1em}
dialog#howto ol{padding-left:1.3em;margin:0 0 12px;line-height:1.8}
dialog#howto p{margin:0 0 10px;font-size:.9rem;line-height:1.7;color:var(--ink2)}
dialog#howto a{color:var(--shu2);min-height:44px;display:inline-flex;align-items:center}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;z-index:9;box-shadow:0 6px 20px #0005;max-width:90%;text-align:center;font-size:1rem}
footer{margin-top:auto;text-align:center;font-size:.8rem;color:var(--ink2);display:flex;gap:4px 14px;justify-content:center;flex-wrap:wrap}
footer a{color:var(--ink2);min-height:44px;display:inline-flex;align-items:center}
.help{background:var(--paper);border:2px solid var(--mo);border-radius:14px;padding:.6rem .9rem;font-size:.88rem;line-height:1.7;text-align:left}
.help b{color:var(--mo2)}
.help a{display:inline-flex;align-items:center;min-height:44px;color:var(--mo2);font-weight:700}
/* 色の見分けを助ける：正解＝青・まちがい＝朱にして、印を大きく */
html.a11y-cvd{--ok:#0b5c96;--ok2:#073f68;--shu:#a63d00;--shu2:#7a2d00}
html.a11y-cvd .ch.ng::after,html.a11y-cvd .ch.ok::after{font-size:.95rem}
html.a11y-cvd .ch.ok{border-width:5px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* all:unset のボタンでも枠が消えないよう、いちばん最後に強く書く */
:is(.icon,button,a):focus-visible{outline:3px solid var(--shu)!important;outline-offset:2px}
</style>

<script id="a11y-script">
/* 見やすさの設定（色覚・ディスレクシア・弱視・動きに弱い人のため）。外へは何も送らない。
   設定は localStorage の a11y-v1 に置く。同じサイト（satou-aaaaa.github.io）のゲームは同じ設定を使う。
   ゲームの側でできること：
   - 設定を開くボタンに data-a11y-open を付ける（無ければ左下に「Aa」のボタンを出す）
   - 読み上げる文に data-a11y-say を付ける（問題文・知らせなど）
   - 色の見分けを助ける形・模様は html.a11y-cvd の下に CSS で書く。JS では A11y.on('cvd')
   - 揺れ・すべる動きを JS で動かすときは、A11y.on('calm') なら止める
   - 設定が変わると document に a11ychange が届く
   - 設定の印は html の class「a11y-<設定の名前>」（a11y-read など）。部品の class はこれと重ならない名前にする（2026-11-05 a11y-say がボタンとぶつかった） */
(() => {
  const KEY = "a11y-v1";
  const root = document.documentElement;
  const OPTS = [
    ["read", "読みやすい文字", "UD フォント・行間と字間を広く"],
    ["cvd", "色の見分けを助ける", "色に形・模様・記号を足す"],
    ["calm", "動きを減らす", "揺れ・点滅・すべる動きを止める"],
    ["say", "読み上げのボタンを出す", "問題や知らせを声で読む（端末の中の声だけ）"],
    ["ruby", "ふりがなを出す", "むずかしい漢字に読みを付ける"],
  ];
  const media = (q) => { try { return matchMedia(q).matches; } catch { return false; } };
  // 保存した値がオブジェクトでなければ（別のページが書いた・手で直した）無かったことにする（2026-11-05 CodeRabbit：true が入ると設定が開けなくなる）
  const load = () => { try { const v = JSON.parse(localStorage.getItem(KEY) || "{}"); return v && typeof v === "object" && !Array.isArray(v) ? v : {}; } catch { return {}; } };
  let S = load();
  // 決めていないものは端末の設定に合わせる（視差効果を減らす → 動きを減らす）
  const on = (k) => (k in S ? !!S[k] : k === "calm" ? media("(prefers-reduced-motion: reduce)") : false);
  let fontLoaded = false;
  const loadFont = () => {
    if (fontLoaded) return; fontLoaded = true;
    // Google Fonts を許しているページだけ取りに行く（許していなければ端末にある UD フォントを使う）
    const csp = (document.querySelector('meta[http-equiv="Content-Security-Policy"]') || {}).content || "";
    if (csp && !/fonts\.googleapis\.com/.test(csp)) return;
    const l = document.createElement("link");
    l.rel = "stylesheet"; l.href = "https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap";
    document.head.appendChild(l);
  };
  const apply = () => {
    for (const [k] of OPTS) root.classList.toggle("a11y-" + k, on(k));
    if (on("read")) loadFont();
    if (sayBtn) sayBtn.hidden = !on("say");
    if (!on("say")) stop();
  };
  const set = (k, v) => {
    S = { ...S, ...load() }; // 別のタブで変えた設定を消さないよう、書く前に読み直す
    S[k] = !!v;
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch { /* 保存できなくても今の画面には効かせる */ }
    apply();
    document.dispatchEvent(new CustomEvent("a11ychange", { detail: { key: k, on: !!v } }));
  };

  // 読み上げ：端末の中の日本語の声だけを使う（外へ文字を送る声は使わない）
  const voice = () => { try { return speechSynthesis.getVoices().find((v) => /^ja/i.test(v.lang) && v.localService) || null; } catch { return null; } };
  const stop = () => { try { speechSynthesis.cancel(); } catch { /* 無い端末 */ } };
  const visible = (el) => { const r = el.getBoundingClientRect(); const cs = getComputedStyle(el); return r.width > 0 && r.height > 0 && cs.visibility !== "hidden" && !el.closest("[hidden],[aria-hidden=true],[inert]"); };
  const textOf = (sel) => [...document.querySelectorAll(sel)].filter(visible).map((el) => (el.getAttribute("aria-label") || el.innerText || "").trim()).filter(Boolean).join("。");
  // data-a11y-say が無い画面では、見出しと知らせの場所を読む（2026-11-05 何も読まれず設定が開くだけだった）
  const sayText = () => textOf("[data-a11y-say]") || textOf("h1,h2,[role=status],[aria-live]");
  const say = (text) => {
    const v = voice();
    if (!v || !text) return false;
    stop();
    const u = new SpeechSynthesisUtterance(text.slice(0, 600));
    u.voice = v; u.lang = v.lang; u.rate = 0.95;
    speechSynthesis.speak(u);
    return true;
  };

  let dlg = null, sayBtn = null, lastFocus = null;
  const build = () => {
    dlg = document.createElement("dialog");
    dlg.className = "a11y-dlg";
    dlg.setAttribute("aria-labelledby", "a11y-h");
    const hasRuby = !!document.querySelector("ruby.a11y-rb");
    dlg.innerHTML = `<h2 id="a11y-h">見やすさ・読みやすさ</h2><p>ほかのゲームにも同じ設定が使われます。文字は2本の指で広げると大きくなります。</p>` +
      OPTS.filter(([k]) => k !== "ruby" || hasRuby).map(([k, n, d]) => `<label><input type="checkbox" data-k="${k}"><span>${n}<small>${d}</small></span></label>`).join("") +
      `<p class="a11y-note" id="a11y-novoice" hidden>この端末には、外へ送らずに読める日本語の声がありません。</p><div class="a11y-row"><button type="button" class="a11y-ok" data-a11y-close>閉じる</button></div>`;
    document.body.appendChild(dlg);
    dlg.addEventListener("change", (e) => {
      const k = e.target.dataset && e.target.dataset.k;
      if (!k) return;
      set(k, e.target.checked);
      if (k === "say") dlg.querySelector("#a11y-novoice").hidden = !(e.target.checked && !voice());
    });
    dlg.querySelector("[data-a11y-close]").addEventListener("click", () => dlg.close());
    dlg.addEventListener("close", () => { if (lastFocus && lastFocus.focus) lastFocus.focus(); });
    sayBtn = document.createElement("button");
    sayBtn.type = "button"; sayBtn.className = "a11y-saybtn"; sayBtn.textContent = "🔊 読む"; sayBtn.setAttribute("aria-label", "画面の問題を読み上げる");
    sayBtn.addEventListener("click", () => {
      try { if (speechSynthesis.speaking) return stop(); } catch { /* 無い端末 */ }
      if (!say(sayText())) open();
    });
    document.body.appendChild(sayBtn);
    if (!document.querySelector("[data-a11y-open]")) {
      const b = document.createElement("button");
      b.type = "button"; b.className = "a11y-btn a11y-float"; b.textContent = "Aa"; b.setAttribute("data-a11y-open", ""); b.setAttribute("aria-label", "見やすさの設定");
      document.body.appendChild(b);
    }
    document.addEventListener("click", (e) => { const t = e.target.closest && e.target.closest("[data-a11y-open]"); if (t) { e.preventDefault(); open(); } });
    apply();
  };
  const open = () => {
    if (!dlg) build();
    lastFocus = document.activeElement;
    for (const c of dlg.querySelectorAll("input[data-k]")) c.checked = on(c.dataset.k);
    dlg.querySelector("#a11y-novoice").hidden = !(on("say") && !voice());
    if (dlg.showModal) dlg.showModal(); else dlg.setAttribute("open", "");
  };
  // 声の一覧はあとから届くことがある。届いたら「声がありません」を出し直す
  try { speechSynthesis.addEventListener("voiceschanged", () => { if (dlg) dlg.querySelector("#a11y-novoice").hidden = !(on("say") && !voice()); }); } catch { /* 無い端末 */ }
  apply();
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", build); else build();
  window.A11y = { on, set, open, say, stop };
})();
</script>
<!-- a11y:end -->

<script>
"use strict";
const $ = (id) => document.getElementById(id), app = $("app");
const SITE = "https://satou-aaaaa.github.io/senkyo-shikumi/";
const FEEDBACK = "https://github.com/satou-aaaaa/senkyo-shikumi/issues/new?template=feedback.yml";
const KEY = "senkyo-v1", EPOCH = "2026-11-07";
const G = window.SENKYO;

// ---- 日付（日本時間。だれでも同じ5問）----
const jstNow = () => new Date(Date.now() + 9 * 3600e3);
const todayKey = () => jstNow().toISOString().slice(0, 10);
const dayNo = (k) => Math.round((Date.parse(k) - Date.parse(EPOCH)) / 864e5) + 1;
const prevDay = (k) => new Date(Date.parse(k) - 864e5).toISOString().slice(0, 10);
const md = (k) => `${+k.slice(5, 7)}/${+k.slice(8, 10)}`;
const listOf = (mode, date) => (mode === "h" ? G.hardTags(date) : G.dailyTags(date));
const tipOf = (k) => G.TIPS[((dayNo(k) - 1) % G.TIPS.length + G.TIPS.length) % G.TIPS.length];

// ---- 練習・とことんの並び（乱数は練習・とことんだけ。今日の5問・上級は data.js の日付の乱数）----
const rid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
function shuffled(a) { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; }
// とことん：場面の問題を全部、毎回ちがう順に（1つの並びの中では同じ問題を出さない）。4問ごとに日付の問題を1つ（日付は毎回ちがう）。
// avoid：前の並びの最後の問題（つなぎ目で同じ問題を続けない）
function endlessList(avoid) {
  let a = shuffled(G.pool("all"));
  if (avoid && a[0] === avoid) a.push(a.shift());
  return a;
}
function practiceList(cat) {
  if (cat && cat.startsWith("te:")) { const t = cat.slice(3); return shuffled(G.pool("all").filter((x) => G.make(x).te === t)).slice(0, 5); }
  return shuffled(G.pool(cat || "all")).slice(0, 5);
}
const starsOf = (m) => (m === 0 ? 3 : m === 1 ? 2 : 1); // m = まちがい＋ヒントの数
const starStr = (s) => `<span class="stars" aria-label="星${s}つ">${"★".repeat(s)}<span class="off">${"☆".repeat(3 - s)}</span></span>`;

// ---- 記録（この端末の localStorage だけ）----
// days/hdays/adays：日付 → { m:[1問ごとのまちがい＋ヒント] }。adays はあとから遊んだ日（連続の日・今日の記録・Ko-fi には数えない）
// dex：しくみ → 正解した数（しくみ帳）。co：議席の計算を解いた数。miss：まちがえた問題（おさらい、12まで）
// runs：モードごとの途中経過（練習で今日・上級の途中を消さない）。edone：終えたとことんの回の id（新しい20件。古いタブで書き戻さない）
const fresh = () => ({ v: 1, days: {}, hdays: {}, adays: {}, dex: {}, co: 0, miss: [], runs: {}, tut: false, kofi: {}, ach: {}, ebest: 0, edone: [] });
const OBJ = ["days", "hdays", "adays", "dex", "runs", "kofi", "ach"];
let MODE = "d";
let mem = null; // 保存できない環境では、開いているあいだだけここに置く
const doneOf = (r) => !!r && r.mode !== "e" && r.res.length >= r.list.length, recOf = (r) => ({ m: r.res.map((x) => x.m), l: r.list.slice() }); // l：解いた問題の札（あとでしくみが増えても、結果に元の問題を出す）
const runKey = (mode, date) => (mode === "a" ? "a:" + date : mode);
const bookOf = (s, m) => (m === "d" ? s.days : m === "h" ? s.hdays : m === "a" ? s.adays : null);
// 終わった回を日ごとの記録に入れる（結果を見る前に閉じても、別のタブが次の日を保存しても、終えた日を失わない）
function bank(s, r) { const b = doneOf(r) ? bookOf(s, r.mode) : null; if (!b || b[r.date] || (r.mode === "a" && s.days[r.date])) return false; b[r.date] = recOf(r); return true; }
const prog = (r) => (r.res ? r.res.length : 0) * 1000 + (r.cur ? (r.cur.wrong || []).length * 10 + (r.cur.hints || 0) : 0);
// 保存に失敗したあとはメモリと保存の両方を読む。合わせる前に両方を fresh() で補う。数は大きいほう、途中経過は同じ回なら進んだほう
function load() {
  let a = null, b = null;
  try { b = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  try { a = mem !== null ? JSON.parse(mem) : null; } catch (e) {}
  if (!a || typeof a !== "object" || a.v !== 1) a = null; if (!b || typeof b !== "object" || b.v !== 1) b = null;
  if (!a || !b) return tidy(Object.assign(fresh(), a || b || {}));
  a = Object.assign(fresh(), a); b = Object.assign(fresh(), b);
  const [n, o] = (a.t || 0) >= (b.t || 0) ? [a, b] : [b, a], s = Object.assign(fresh(), n);
  for (const k in o) {
    if (k === "runs" || k === "t") continue;
    const x = o[k], y = n[k];
    if (Array.isArray(x) && Array.isArray(y)) s[k] = k === "miss" ? y : [...new Set([...y, ...x])].slice(-20);
    else if (x && y && typeof x === "object" && typeof y === "object") { s[k] = Object.assign({}, x, y); for (const q in x) if (typeof x[q] === "number" && typeof y[q] === "number") s[k][q] = Math.max(x[q], y[q]); }
    else if (typeof x === "number" && typeof y === "number") s[k] = Math.max(x, y);
    else if (x === true) s[k] = true;
  }
  const ra = a.runs || {}, rb = b.runs || {};
  s.runs = Object.assign({}, n.runs);
  for (const m of new Set([...Object.keys(ra), ...Object.keys(rb)])) {
    const x = ra[m], y = rb[m];
    if (x === undefined || y === undefined) { if (x || y) s.runs[m] = x || y; continue; }
    if (!x || !y) { const r = x || y; if (!r || bank(s, r) || doneOf(r)) continue; const bd = bookOf(s, r.mode); if (!bd || !bd[r.date]) s.runs[m] = r; continue; }
    if (x.id !== y.id) { const [w, l] = (x.date || "") > (y.date || "") ? [x, y] : (x.date || "") < (y.date || "") ? [y, x] : n.runs[m] === x ? [x, y] : [y, x]; bank(s, l); s.runs[m] = w; }
    else { const px = prog(x), py = prog(y); s.runs[m] = px > py ? x : py > px ? y : n.runs[m]; }
  }
  return tidy(s);
}
// 引き継ぎコードなどから入った値を正しい形に直す（数の所に文字が入っていても画面に出さない。壊れた途中経過は捨てる）
const num = (v) => (Number.isFinite(+v) && +v >= 0 ? Math.floor(+v) : 0);
const okDate = (v) => { if (typeof v !== "string" || !/^\d{4}-\d\d-\d\d$/.test(v)) return false; const t = Date.parse(v + "T00:00:00Z"); return Number.isFinite(t) && new Date(t).toISOString().slice(0, 10) === v; };
const ID_RE = /^[a-z][a-z0-9-]{0,39}$/, TAG_RE = /^(q:[a-z][a-z0-9-]{0,39}|[dD]:(0|[1-9]\d{0,7}))$/; // 新しい版のしくみの札の形（中身は G.ok で確かめてから使う）
function tidy(s) {
  s.ebest = num(s.ebest); s.co = num(s.co);
  for (const q of OBJ) if (!s[q] || typeof s[q] !== "object" || Array.isArray(s[q])) s[q] = {};
  s.miss = Array.isArray(s.miss) ? s.miss.filter(G.ok).slice(-12) : [];
  s.edone = Array.isArray(s.edone) ? s.edone.filter((x) => typeof x === "string").slice(-20) : [];
  // 知らないしくみの id も、形が正しければ残す（新しい版で足したしくみの記録を、古いタブの保存で消さない。2026-11-07 CodeRabbit）
  for (const k in s.dex) if (!G.BYTE[k] && !ID_RE.test(k)) delete s.dex[k]; else s.dex[k] = num(s.dex[k]);
  // 今日の5問・あとからは5問、上級は3問の記録だけを残す（足りない記録で「全問正解」にしない）
  const okRec = (x, n) => !!x && typeof x === "object" && Array.isArray(x.m) && x.m.length === n && x.m.every((v) => Number.isInteger(v) && v >= 0) && (x.l === undefined || (Array.isArray(x.l) && x.l.length === n && x.l.every((t) => typeof t === "string" && TAG_RE.test(t))));
  for (const [b, n] of [[s.days, 5], [s.hdays, 3], [s.adays, 5]]) for (const d in b) if (!okDate(d) || !okRec(b[d], n)) delete b[d];
  for (const m in s.runs) {
    const r = s.runs[m]; if (r === null) continue;
    // 置き場の名前とモードが合わない途中経過・終えたとことんの回は捨てる
    const want = /^[dhpe]$/.test(m) ? m : /^a:/.test(m) ? "a" : null;
    if (!r || typeof r !== "object" || r.mode !== want || (want === "a" && r.date !== m.slice(2)) || (want === "e" && s.edone.includes(r.id))) { delete s.runs[m]; continue; }
    if (typeof r !== "object" || typeof r.id !== "string" || !okDate(r.date) || !Array.isArray(r.list) || !r.list.length || !r.list.every(G.ok) || !Array.isArray(r.res) || !r.res.every((x) => x && typeof x === "object" && Number.isInteger(x.m) && x.m >= 0)) { delete s.runs[m]; continue; }
    if (r.cur != null && (typeof r.cur !== "object" || !Array.isArray(r.cur.wrong) || !r.cur.wrong.every((w) => Number.isInteger(w)))) r.cur = null; else if (r.cur) r.cur.hints = num(r.cur.hints);
    if (r.mode === "e") { r.first = num(r.first); r.miss = num(r.miss); }
  }
  return s;
}
// 保存の前に読み直す（別のタブで進めた記録を消さない）
function save(fn) { const s = load(); fn(s); s.t = Math.max(Date.now(), (s.t || 0) + 1); const j = JSON.stringify(s); try { localStorage.setItem(KEY, j); mem = null; } catch (e) { mem = j; } return s; }
function streak(days) { let k = todayKey(), n = 0; if (!days[k]) k = prevDay(k); while (days[k]) { n++; k = prevDay(k); } return n; }
const playedDays = (s) => new Set([...Object.keys(s.days), ...Object.keys(s.adays)]).size;
const seenAll = (s) => Object.values(s.dex).reduce((a, b) => a + (+b || 0), 0);
// 取りこぼした日：今日より前の7日のうち、今日の5問もあとからも遊んでいない日（新しい順。第1回より前は無い）
const LATE = 7;

    if (Array.isArray(run.a0)) newAch = achGot(s2).filter((id) => !run.a0.includes(id) && !s2.ach[id]);

// とことんの終わり：一度で正解した問題の数を自己ベストと比べる（他の人との順位は出さない）。別のタブで終えた回は書き戻さない
function endFinish(run) {
  const n = run.first || 0, all = run.res.length; let prev = 0, newAch = [], stale = false;
  save((s2) => {
    if (s2.edone.includes(run.id)) { stale = true; return; }
    prev = s2.ebest || 0; s2.ebest = Math.max(prev, n); s2.edone = [...s2.edone, run.id].slice(-20);
    const c = s2.runs.e; if (c && c.id === run.id) s2.runs.e = null;
    if (Array.isArray(run.a0)) newAch = achGot(s2).filter((id) => !run.a0.includes(id) && !s2.ach[id]); for (const id of newAch) s2.ach[id] = 1;
  });
  if (stale) return home();
  const s = load(), best = n > prev && n > 0;
  app.innerHTML = `
    <header><button class="icon" id="back" aria-label="ホームへ">←</button><h1>選挙のしくみ<small>とことん</small></h1></header>

    <p class="note" id="ebest">${best ? "🎉 自己ベスト更新！" : `自己ベスト ${s.ebest}問${s.ebest > n ? `（あと${s.ebest - n + 1}問で更新）` : ""}`}</p>
    ${newAch.length ? `<p class="achnew" id="achnew">${newAch.map((id) => `🏅 実績：${ACH.find((a) => a[0] === id)[1]}`).join("<br>")}</p>` : ""}
    <button class="main" id="go-e">もう一度とことん</button>
    <div class="row"><button class="sub" id="go-p">練習する</button><button class="sub" id="go-dex">しくみ帳を見る</button></div>
    <p class="note"><a href="${FEEDBACK}" target="_blank" rel="noopener">感想を送る</a></p>`;
  $("back").onclick = home; $("go-e").onclick = () => startRun("e"); $("go-p").onclick = practiceMenu; $("go-dex").onclick = book;
  toTop();

// 共有の文：問題・答えは出さない。まちがい＋ヒントの数で色と形を変える（色だけで分けない）
const sq = (m) => (m === 0 ? "🟢" : m === 1 ? "🔶" : "🔺");
function shareText(mode, k, rec) { return `選挙のしくみ${mode === "h" ? " 上級" : ""} 第${dayNo(k)}回 ${md(k)}\n${rec.m.map(sq).join("")}${rec.m.every((m) => m === 0) ? " 全問正解" : ""}`; }
function untilNext() { const n = jstNow(), ms = 864e5 - (n.getTime() % 864e5); return `${Math.floor(ms / 36e5)}時間${Math.floor((ms % 36e5) / 6e4)}分`; }

  const showKofi = first && mode !== "p" && !late && total === 0 && !s.kofi[k + mode]; // あとから・練習・まちがいのある日には出さない

// しくみ帳：正解したしくみと数。押すと説明と出典、そのしくみだけの練習

function achView() {

    <header><button class="icon" id="back" aria-label="ホームへ">←</button><h1>実績<small>${got.length}/${ACH.length}</small></h1></header>
    ${AGRP.map((g, gi) => `<p class="agrp">${g}</p><div class="alist">${ACH.filter((a) => a[3] === gi).map((a) => { const ok = got.includes(a[0]), n = Math.min(t[a[4]], a[5]); return `<div class="ach${ok ? " got" : ""}" data-id="${a[0]}"><span class="ic" aria-hidden="true">🏅</span><b>${ok ? "✓ " : ""}${a[1]}</b><span class="pg">${ok ? "達成" : `${n}/${a[5]}`}</span><small>${a[2]}</small>${ok ? "" : `<span class="bar"><i style="width:${Math.round((n / a[5]) * 100)}%"></i></span>`}</div>`; }).join("")}</div>`).join("")}

// 遊んだ日のカレンダー：今日の5問の日は★（まちがいの少なさ）、あとから遊んだ日は ↺、取りこぼした過去7日は押すとあとから遊べる
const ymOf = (k) => k.slice(0, 7);
const ymAdd = (ym, n) => { const d = new Date(Date.UTC(+ym.slice(0, 4), +ym.slice(5, 7) - 1 + n, 1)); return d.toISOString().slice(0, 7); };
const lvOf = (rec) => { const t = rec.m.reduce((a, b) => a + b, 0); return t === 0 ? 3 : t <= 2 ? 2 : 1; };
function cal(ym) {
  const s = load(), k = todayKey(), late = lateDays(s, k), st = streak(s.days);
  if (!ym || ym > ymOf(k)) ym = ymOf(k);
  if (ym < ymOf(EPOCH)) ym = ymOf(EPOCH);
  const y = +ym.slice(0, 4), m = +ym.slice(5, 7), dow = new Date(Date.UTC(y, m - 1, 1)).getUTCDay(), n = new Date(Date.UTC(y, m, 0)).getUTCDate(), cells = [];
  for (let i = 0; i < dow; i++) cells.push(`<span class="c off"></span>`);
  for (let d = 1; d <= n; d++) {
    const key = `${ym}-${String(d).padStart(2, "0")}`, rec = s.days[key], ar = s.adays[key], hd = s.hdays[key] ? `<span class="hd">▲</span>` : "";
    const hl = s.hdays[key] ? "・上級" : "";
    if (rec) { const lv = lvOf(rec); cells.push(`<span class="c p${lv}" data-k="${key}" role="img" aria-label="${m}月${d}日 星${lv}つ${hl}">${d}<i>${"★".repeat(lv)}</i>${hd}</span>`); }
    else if (ar) cells.push(`<span class="c late" data-k="${key}" role="img" aria-label="${m}月${d}日 あとから遊んだ${hl}">${d}<i>↺</i>${hd}</span>`);
    else if (late.includes(key)) { const go = s.runs[runKey("a", key)]; cells.push(`<button class="c miss" data-k="${key}" aria-label="${m}月${d}日をあとから遊ぶ${go ? "（続きから）" : ""}">${d}<i>${go ? "続き" : "▶"}</i></button>`); }
    else cells.push(`<span class="c${key === k ? " today" : ""}" data-k="${key}">${d}${hd}</span>`);
  }
  const pd = playedDays(s);
  app.innerHTML = `<header><button class="icon" id="back" aria-label="ホームへ">←</button><h1>カレンダー${pd ? `<small>合わせて ${pd}日${st >= 1 ? `・続けて ${st}日` : ""}</small>` : ""}</h1></header>
    <div class="calnav"><button class="sub" id="prev" aria-label="前の月"${ym <= ymOf(EPOCH) ? " disabled" : ""}>‹</button><b>${y}年${m}月</b><button class="sub" id="next" aria-label="次の月"${ym >= ymOf(k) ? " disabled" : ""}>›</button></div>
    <div class="cal">${["日", "月", "火", "水", "木", "金", "土"].map((w) => `<span class="wd">${w}</span>`).join("")}${cells.join("")}</div>
    <div class="legend"><span><em style="background:var(--mo)"></em>★★★ 全部一度で</span><span><em style="background:#cfe5d8"></em>★★ 1〜2回</span><span>↺ あとから</span><span>▲ 上級</span></div>

  bindFooter(); toTop();
}
